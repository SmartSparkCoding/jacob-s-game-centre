<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="fun_centre_icon.ico" type="image/x-icon">
<title>Fun Centre</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#333;
}

#home-icon{
position:fixed;
top:12px;
left:12px;
width:90px;
height:90px;
z-index:30;
display:none;
}

#loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
font-size:24px;
opacity:1;
transition:opacity .6s ease;
z-index:100;
}

#loading-icon{
width:220px;
height:220px;
object-fit:contain;
transition:opacity .6s ease,transform .6s ease;
}

#loading-text{
margin-top:24px;
font-size:26px;
opacity:0;
transition:opacity .6s ease;
}

#game-select{
display:none;
padding:40px;
text-align:center;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

#filter-bar{
display:flex;
gap:12px;
justify-content:center;
align-items:center;
margin-bottom:18px;
flex-wrap:wrap;
}

#filter-bar select,
#filter-bar button{
padding:8px 10px;
border-radius:6px;
border:1px solid #bbb;
background:white;
}

#filter-bar button{
background:#333;
color:white;
border:none;
cursor:pointer;
}

.game-card{
background:white;
border-radius:12px;
padding:15px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
transition:.25s;
cursor:pointer;
position:relative;
border:2px solid transparent;
}

.game-card:hover{
transform:translateY(-6px);
box-shadow:0 8px 18px rgba(0,0,0,.15);
}

.game-card img{
width:100%;
border-radius:10px;
}

.fav-btn{
position:absolute;
top:10px;
right:10px;
width:34px;
height:34px;
border-radius:6px;
background:white;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #ddd;
cursor:pointer;
}

.fav-btn svg{
width:18px;
height:18px;
fill:#bbb;
}

.fav-btn.favourited{
border-color:gold;
background:#fff8d6;
}

.fav-btn.favourited svg{
fill:gold;
}

.game-card.favourite{
border-color:gold;
}

#game-viewer{
display:none;
width:100%;
height:100vh;
background:#eaeaea;
position:relative;
}

#game-frame{
width:100%;
height:100%;
border:none;
}

#back-btn{
position:absolute;
top:20px;
left:20px;
padding:10px 18px;
background:#333;
color:white;
border-radius:6px;
cursor:pointer;
z-index:5;
}

#countdown{
position:fixed;
top:15px;
right:20px;
background:#333;
color:white;
padding:8px 14px;
border-radius:6px;
display:none;
z-index:20;
}

#block-overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
display:none;
justify-content:center;
align-items:center;
z-index:50;
}

#block-box{
background:white;
padding:30px;
width:350px;
border-radius:12px;
text-align:center;
}

#override-input{
width:80%;
padding:10px;
margin-top:15px;
}

#override-btn{
margin-top:12px;
padding:10px 20px;
background:#333;
color:white;
border-radius:6px;
cursor:pointer;
}
</style>
</head>
<body>

<a href="https://github.com/SmartSparkCoding/jacob-s-fun-centre" target="_blank">
<img id="home-icon" src="fun_centre_icon.ico" alt="Fun Centre Icon">
</a>

<div id="loading-screen">
<img id="loading-icon" src="fun_centre_icon.ico" alt="Loading Icon">
<div id="loading-text">
Created and Designed by Jacob N
</div>
</div>

<div id="countdown"></div>

<div id="game-select">

<h1 style="grid-column:1/-1;">
Fun Centre
</h1>

<div id="filter-bar" style="grid-column:1/-1;">
<select id="filter-creator">
<option value="">All Creators</option>
</select>

<select id="filter-program">
<option value="">All Programs</option>
</select>

<select id="filter-type">
<option value="">All Types</option>
</select>

<button id="clear-filters">
Clear Filters
</button>
</div>


<div class="game-card"
onclick="openGame('slimeshooter.html')"
data-creator="Tristan P"
data-program="Scratch"
data-type="Shooter">

<div class="fav-btn" onclick="toggleFavourite(event,this)">
<svg viewBox="0 0 24 24">
<path d="M12 17.3l6.18 3.73-1.64-7.03L21 9.24l-7.19-.61L12 2 10.19 8.63 3 9.24l4.46 4.76L5.82 21z"/>
</svg>
</div>

<img src="slime_shooter.jpg">
<h2>Slime Shooter</h2>
<p>Created by Tristan P<br>Designed in Scratch</p>

</div>


<div class="game-card"
onclick="openGame('orbitaloutpost.html')"
data-creator="Jacob N"
data-program="HTML"
data-type="Strategy">

<div class="fav-btn" onclick="toggleFavourite(event,this)">
<svg viewBox="0 0 24 24">
<path d="M12 17.3l6.18 3.73-1.64-7.03L21 9.24l-7.19-.61L12 2 10.19 8.63 3 9.24l4.46 4.76L5.82 21z"/>
</svg>
</div>

<img src="orbital_outpost.jpg">
<h2>Orbital Outpost</h2>
<p>Created by Jacob N<br>Created Locally in HTML</p>

</div>


<div class="game-card"
onclick="openGame('basketballshooter.html')"
data-creator="Will R"
data-program="HTML"
data-type="Sports">

<div class="fav-btn" onclick="toggleFavourite(event,this)">
<svg viewBox="0 0 24 24">
<path d="M12 17.3l6.18 3.73-1.64-7.03L21 9.24l-7.19-.61L12 2 10.19 8.63 3 9.24l4.46 4.76L5.82 21z"/>
</svg>
</div>

<img src="basketball_shooter.jpg">
<h2>Basketball Shooter</h2>
<p>Created by Will R<br>Created Locally in HTML</p>

</div>

</div>


<div id="game-viewer">
<div id="back-btn" onclick="goBack()">
Back
</div>
<iframe id="game-frame"></iframe>
</div>


<div id="block-overlay">
<div id="block-box">
<h2>
Fun Centre is blocked during Lesson Time
</h2>

<p id="unlock-countdown"></p>

<input
type="password"
id="override-input"
placeholder="Enter override code">

<div id="override-btn"
onclick="checkOverride()">
Unlock
</div>

</div>
</div>


<script>

const scrambled="a2b9c0d5e1f2g1h5i0j2k1l7";

function getRealCode(){
return scrambled.replace(/[a-z]/g,"");
}

let overrideActive=false;

const lessonWindows=[
["08:40","11:00"],
["11:25","13:00"],
["14:20","15:50"]
];

function isLessonTime(){

if(overrideActive) return false;

const now=new Date();

const day=now.getUTCDay();

if(day===0||day===6) return false;

const current=
now.getUTCHours()*60+
now.getUTCMinutes();

for(let [start,end] of lessonWindows){

let [sh,sm]=start.split(":").map(Number);
let [eh,em]=end.split(":").map(Number);

if(
current>=sh*60+sm &&
current<=eh*60+em
){
return true;
}
}

return false;
}

function getTimeUntilChange(){

if(overrideActive) return null;

const now=new Date();

const current=
now.getUTCHours()*60+
now.getUTCMinutes();

let times=[];

lessonWindows.forEach(([s,e])=>{

let [sh,sm]=s.split(":").map(Number);
let [eh,em]=e.split(":").map(Number);

times.push(
sh*60+sm,
eh*60+em
);

});

times.sort((a,b)=>a-b);

for(let t of times){
if(t>current){
return t-current;
}
}

return null;
}

function updateLockState(){

let overlay=
document.getElementById("block-overlay");

let countdown=
document.getElementById("countdown");

let unlock=
document.getElementById("unlock-countdown");

if(overrideActive){
overlay.style.display="none";
countdown.style.display="none";
return;
}

let lesson=isLessonTime();

let mins=getTimeUntilChange();

if(lesson){

overlay.style.display="flex";
countdown.style.display="none";

unlock.innerText=
mins?
`Unlocks in ${mins} minutes`
:"";

}
else{

overlay.style.display="none";
countdown.style.display="block";

countdown.innerText=
mins?
`Locking in ${mins} minutes`
:"";

}

}

setInterval(updateLockState,5000);
updateLockState();

function checkOverride(){

let input=
document.getElementById(
"override-input"
).value;

if(input===getRealCode()){

overrideActive=true;

document.getElementById(
"block-overlay"
).style.display="none";

}
else{
alert("Incorrect code");
}

}

window.onload=function(){

setTimeout(()=>{

document.getElementById(
"loading-icon"
).style.opacity="0";

setTimeout(()=>{

document.getElementById(
"loading-icon"
).style.display="none";

document.getElementById(
"loading-text"
).style.opacity="1";

setTimeout(()=>{

document.getElementById(
"loading-screen"
).style.display="none";

document.getElementById(
"game-select"
).style.display="grid";

document.getElementById(
"home-icon"
).style.display="block";

initFavouritesAndFilters();

},1200);

},600);

},900);

};

function openGame(file){

sessionStorage.setItem(
"fc_verified",
"yes"
);

document.getElementById(
"game-select"
).style.display="none";

document.getElementById(
"game-viewer"
).style.display="block";

document.getElementById(
"game-frame"
).src=file;

document.getElementById(
"home-icon"
).style.display="none";

}

function goBack(){

document.getElementById(
"game-viewer"
).style.display="none";

document.getElementById(
"game-frame"
).src="";

document.getElementById(
"game-select"
).style.display="grid";

document.getElementById(
"home-icon"
).style.display="block";

}

const FAV_KEY="fc_favourites_v1";

function getCardId(card){

return(
card.querySelector("h2").innerText+
"||"+
card.dataset.creator
).replace(/\s+/g,"_");

}

function loadFavourites(){

return JSON.parse(
localStorage.getItem(
FAV_KEY
)||"[]"
);

}

function saveFavourites(a){

localStorage.setItem(
FAV_KEY,
JSON.stringify(a)
);

}

function toggleFavourite(e,btn){

e.stopPropagation();

let card=
btn.closest(".game-card");

let id=getCardId(card);

let favs=
loadFavourites();

let i=
favs.indexOf(id);

if(i===-1){
favs.push(id);
}else{
favs.splice(i,1);
}

saveFavourites(favs);

applyFavouritesToCards();

}

function applyFavouritesToCards(){

let favs=
loadFavourites();

document
.querySelectorAll(".game-card")
.forEach(card=>{

let id=
getCardId(card);

let btn=
card.querySelector(".fav-btn");

if(
favs.includes(id)
){
card.classList.add("favourite");
btn.classList.add("favourited");
}else{
card.classList.remove("favourite");
btn.classList.remove("favourited");
}

});

}

function initFilters(){

["creator","program","type"]
.forEach(type=>{

let select=
document.getElementById(
"filter-"+type
);

let values=
new Set();

document
.querySelectorAll(".game-card")
.forEach(card=>{

let v=
card.dataset[type];

if(v) values.add(v);

});

[...values]
.sort()
.forEach(v=>{

let o=
document.createElement(
"option"
);

o.value=v;
o.textContent=v;

select.appendChild(o);

});

select.addEventListener(
"change",
applyFilters
);

});

document
.getElementById(
"clear-filters"
)
.onclick=()=>{

document.getElementById(
"filter-creator"
).value="";

document.getElementById(
"filter-program"
).value="";

document.getElementById(
"filter-type"
).value="";

applyFilters();

};

}

function applyFilters(){

let c=
document.getElementById(
"filter-creator"
).value;

let p=
document.getElementById(
"filter-program"
).value;

let t=
document.getElementById(
"filter-type"
).value;

document
.querySelectorAll(".game-card")
.forEach(card=>{

let show=
(!c||card.dataset.creator===c)&&
(!p||card.dataset.program===p)&&
(!t||card.dataset.type===t);

card.style.display=
show?"":"none";

});

}

function initFavouritesAndFilters(){
applyFavouritesToCards();
initFilters();
}

</script>

</body>
</html>
